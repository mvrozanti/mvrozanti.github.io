name: Refresh contributions and deploy

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Refresh contributions.json
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          FROM=$(date -u -d '365 days ago' +%Y-%m-%dT%H:%M:%SZ)
          TO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if gh api graphql \
              -f query='query($user:String!, $from:DateTime!, $to:DateTime!) {
                user(login:$user) {
                  contributionsCollection(from:$from, to:$to) {
                    contributionCalendar {
                      weeks { contributionDays { contributionCount date } }
                    }
                  }
                }
              }' \
              -f user=mvrozanti -f from="$FROM" -f to="$TO" \
              --jq '.data.user.contributionsCollection.contributionCalendar.weeks' \
              > /tmp/contributions.json \
             && [ -s /tmp/contributions.json ] \
             && [ "$(jq 'length' /tmp/contributions.json)" -gt 0 ]; then
            mv /tmp/contributions.json public/contributions.json
            echo "refreshed: $(jq 'length' public/contributions.json) weeks"
          else
            echo "::warning::contributions refresh failed; keeping committed snapshot"
          fi

      - name: Commit refreshed snapshot
        run: |
          if ! git diff --quiet -- public/contributions.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/contributions.json
            git commit -m "chore: refresh contributions snapshot"
            git push origin master
          else
            echo "no change"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static export
        run: |
          npm install
          cat > next.config.ts <<'EOL'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: 'export',
            distDir: 'out',
            eslint: { ignoreDuringBuilds: true },
            typescript: { ignoreBuildErrors: true },
            trailingSlash: true,
            images: { unoptimized: true },
          };
          export default nextConfig;
          EOL
          npx next build
          touch out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          enable_jekyll: false
